name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  unit-property:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  # Deterministic simulation (ADR-0016): 200 seeds + regressions + every canary, per PR.
  sim:
    runs-on: ubuntu-latest
    env:
      SIM_SEEDS: "200"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -n auto -q tests/sim

  # Prometheus + Grafana against a real 3-node cluster (ADR-0024). Ubuntu only: no Docker
  # on the macOS runners. CHRONOS_BIND=0.0.0.0 so the containers can reach the host.
  observability-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: docker compose -f deploy/observability/docker-compose.yml up -d
      - run: CHRONOS_BIND=0.0.0.0 uv run pytest -m observability -v tests/integration/test_observability.py
      - if: failure()
        run: docker compose -f deploy/observability/docker-compose.yml logs
