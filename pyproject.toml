[project]
name = "chronos"
version = "0.0.1"
description = "A from-scratch, scoped container orchestrator (mini-Kubernetes) in Python."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
chronosd = "chronos.server.main:app"
chronos-agent = "chronos.agent.main:app"
chronosctl = "chronos.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronos"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "PL", "TID", "RUF"]
ignore = ["PLR2004", "PLR0913"]

# ADR-0006: all time goes through chronos.common.clock; tests wait with eventually(), never sleep.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.sleep".msg = "Use Clock.sleep (ADR-0006); in tests wait with eventually()."
"time.monotonic".msg = "Use Clock.monotonic (ADR-0006)."
"time.time".msg = "Use Clock.wall / Clock.monotonic (ADR-0006)."
"asyncio.sleep".msg = "Use Clock.sleep (ADR-0006); in tests wait with eventually()."

[tool.ruff.lint.per-file-ignores]
"src/chronos/common/clock.py" = ["TID251"]
"src/chronos/testing/workload.py" = ["TID251"]  # a plain sync test process

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["chronos.core.*", "chronos.store.*"]
disallow_any_explicit = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
addopts = "--strict-markers -m 'not chaos and not quarantine'"
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "invariant(id): test checks the named invariant from docs/TESTING.md section 2",
    "integration: real chronosd + agents + workload processes",
    "chaos: long-running randomized fault injection",
    "quarantine: known-flaky test, excluded from PR runs (max 7 days)",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
]
